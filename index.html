<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR LINK - Berebut Link Lomba</title>
    <style>
        /* Reset dan Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        /* Glassmorphism Container */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Judul */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Countdown */
        #countdown {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: #ffd700;
        }

        /* Tombol */
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin: 10px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:disabled {
            background: rgba(128, 128, 128, 0.5);
            cursor: not-allowed;
        }

        /* Input dan List */
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li button {
            background: rgba(255, 0, 0, 0.5);
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        /* Responsif */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            #countdown {
                font-size: 2rem;
            }
            .glass {
                padding: 20px;
            }
        }

        /* Hidden Admin */
        #admin-panel {
            display: none;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1 id="event-title">Lomba WAR LINK</h1>
        <div id="countdown">00:00:00</div>
        <button id="war-link-btn" disabled>WAR LINK</button>
        <p id="status">Menunggu start dari developer...</p>
        <button id="admin-btn">Admin Panel</button>
    </div>

    <!-- Admin Panel (Hidden) -->
    <div class="glass" id="admin-panel">
        <h2>Panel Admin</h2>
        <label>Nama Jenis Lomba:</label>
        <input type="text" id="event-name" placeholder="Masukkan nama lomba">
        <label>Durasi Countdown (menit):</label>
        <input type="number" id="countdown-duration" placeholder="10" min="1">
        <button id="set-countdown">Set Countdown</button>
        <button id="start-btn">Start WAR LINK</button>
        <button id="stop-btn">Stop WAR LINK</button>
        <label>Tambah Link:</label>
        <input type="text" id="new-link" placeholder="Masukkan link baru">
        <button id="add-link">Tambah Link</button>
        <ul id="link-list"></ul>
    </div>

    <script>
        // Elemen DOM
        const eventTitle = document.getElementById('event-title');
        const countdownEl = document.getElementById('countdown');
        const warLinkBtn = document.getElementById('war-link-btn');
        const statusEl = document.getElementById('status');
        const adminBtn = document.getElementById('admin-btn');
        const adminPanel = document.getElementById('admin-panel');
        const eventNameInput = document.getElementById('event-name');
        const countdownDurationInput = document.getElementById('countdown-duration');
        const setCountdownBtn = document.getElementById('set-countdown');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const newLinkInput = document.getElementById('new-link');
        const addLinkBtn = document.getElementById('add-link');
        const linkList = document.getElementById('link-list');

        // Data dari localStorage
        let links = JSON.parse(localStorage.getItem('links')) || [];
        let eventName = localStorage.getItem('eventName') || 'Lomba WAR LINK';
        let countdownTime = parseInt(localStorage.getItem('countdownTime')) || 0;
        let isStarted = localStorage.getItem('isStarted') === 'true';
        let isStopped = localStorage.getItem('isStopped') === 'true';
        let interval;

        // Update UI
        function updateUI() {
            eventTitle.textContent = eventName;
            eventNameInput.value = eventName;
            renderLinks();
            if (isStopped) {
                statusEl.textContent = 'Link sudah full! Sesi dihentikan.';
                warLinkBtn.disabled = true;
                countdownEl.textContent = '00:00:00';
            } else if (isStarted) {
                statusEl.textContent = 'Sesi WAR LINK sedang berlangsung!';
                warLinkBtn.disabled = false;
                countdownEl.textContent = 'MULAI!';
            } else if (countdownTime > 0) {
                statusEl.textContent = 'Countdown dimulai...';
                warLinkBtn.disabled = true;
                startCountdown();
            } else {
                statusEl.textContent = 'Menunggu start dari developer...';
                warLinkBtn.disabled = true;
                countdownEl.textContent = '00:00:00';
            }
        }

        // Countdown Timer
        function startCountdown() {
            clearInterval(interval);
            interval = setInterval(() => {
                if (countdownTime <= 0) {
                    clearInterval(interval);
                    isStarted = true;
                    localStorage.setItem('isStarted', 'true');
                    updateUI();
                    return;
                }
                countdownTime--;
                localStorage.setItem('countdownTime', countdownTime);
                const minutes = Math.floor(countdownTime / 60);
                const seconds = countdownTime % 60;
                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}:00`;
            }, 1000);
        }

        // Render Links
        function renderLinks() {
            linkList.innerHTML = '';
            links.forEach((link, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${link}</span><button onclick="removeLink(${index})">Hapus</button>`;
                linkList.appendChild(li);
            });
        }

        // Admin Access
        adminBtn.addEventListener('click', () => {
            const password = prompt('Masukkan password admin:');
            if (password === 'admin123') {
                adminPanel.style.display = 'block';
            } else {
                alert('Password salah!');
            }
        });

        // Set Event Name
        eventNameInput.addEventListener('change', () => {
            eventName = eventNameInput.value;
            localStorage.setItem('eventName', eventName);
            updateUI();
        });

        // Set Countdown
        setCountdownBtn.addEventListener('click', () => {
            const duration = parseInt(countdownDurationInput.value);
            if (duration > 0) {
                countdownTime = duration * 60;
                localStorage.setItem('countdownTime', countdownTime);
                isStarted = false;
                isStopped = false;
                localStorage.setItem('isStarted', 'false');
                localStorage.setItem('isStopped', 'false');
                updateUI();
            }
        });

        // Start
        startBtn.addEventListener('click', () => {
            if (countdownTime > 0) {
                startCountdown();
            } else {
                isStarted = true;
                localStorage.setItem('isStarted', 'true');
                updateUI();
            }
        });

        // Stop
        stopBtn.addEventListener('click', () => {
            isStopped = true;
            localStorage.setItem('isStopped', 'true');
            clearInterval(interval);
            updateUI();
        });

        // Add Link
        addLinkBtn.addEventListener('click', () => {
            const link = newLinkInput.value.trim();
            if (link) {
                links.push(link);
                localStorage.setItem('links', JSON.stringify(links));
                newLinkInput.value = '';
                renderLinks();
            }
        });

        // Remove Link
        function removeLink(index) {
            links.splice(index, 1);
            localStorage.setItem('links', JSON.stringify(links));
            renderLinks();
        }

        // WAR LINK Button
        warLinkBtn.addEventListener('click', () => {
            if (links.length > 0 && !isStopped) {
                const randomIndex = Math.floor(Math.random() * links.length);
                const wonLink = links.splice(randomIndex, 1)[0];
                localStorage.setItem('links', JSON.stringify(links));
                alert(`Selamat! Anda mendapatkan link: ${wonLink}`);
                renderLinks();
                if (links.length === 0) {
                    isStopped = true;
                    localStorage.setItem('isStopped', 'true');
                    updateUI();
                }
            } else {
                alert('Tidak ada link tersedia atau sesi sudah berhenti.');
            }
        });

        // Init
        updateUI();
    </script>
</body>
</html>
