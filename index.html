<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAR LINK - Berebut Link Lomba</title>
    <style>
        /* Sama seperti sebelumnya */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        #countdown {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            color: #ffd700;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin: 10px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:disabled {
            background: rgba(128, 128, 128, 0.5);
            cursor: not-allowed;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: rgba(255, 255, 255, 0.1);
            margin: 5px 0;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li button {
            background: rgba(255, 0, 0, 0.5);
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            #countdown {
                font-size: 2rem;
            }
            .glass {
                padding: 20px;
            }
        }

        #admin-panel {
            display: none;
        }
    </style>
</head>
<body>
    <div class="glass">
        <h1 id="event-title">Lomba WAR LINK</h1>
        <div id="countdown">00:00:00</div>
        <button id="war-link-btn" disabled>WAR LINK</button>
        <p id="status">Menunggu start dari developer...</p>
        <button id="admin-btn">Admin Panel</button>
    </div>

    <div class="glass" id="admin-panel">
        <h2>Panel Admin</h2>
        <label>Nama Jenis Lomba:</label>
        <input type="text" id="event-name" placeholder="Masukkan nama lomba">
        <label>Durasi Countdown (menit):</label>
        <input type="number" id="countdown-duration" placeholder="10" min="1">
        <button id="set-countdown">Set Countdown</button>
        <button id="start-btn">Start WAR LINK</button>
        <button id="stop-btn">Stop WAR LINK</button>
        <label>Tambah Link:</label>
        <input type="text" id="new-link" placeholder="Masukkan link baru">
        <button id="add-link">Tambah Link</button>
        <ul id="link-list"></ul>
    </div>

    <script>
        // Konfigurasi JSONBin (ganti dengan data Anda)
        const BIN_ID = '69525d01ae596e708fb7cc3e';  // Misalnya: '5f9b5c0b5d4b4c001f3b4b5c'
        const API_KEY = '$2a$10$Hnx8tdI5Kq0oJ2K.GXCodeZMwA.hL3eLAR2c1KoiVxH1d0q.iW1Jq';  // Master Key dari akun Anda
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const UPDATE_URL = `${BIN_URL}/latest`;  // Untuk update

        // Elemen DOM
        const eventTitle = document.getElementById('event-title');
        const countdownEl = document.getElementById('countdown');
        const warLinkBtn = document.getElementById('war-link-btn');
        const statusEl = document.getElementById('status');
        const adminBtn = document.getElementById('admin-btn');
        const adminPanel = document.getElementById('admin-panel');
        const eventNameInput = document.getElementById('event-name');
        const countdownDurationInput = document.getElementById('countdown-duration');
        const setCountdownBtn = document.getElementById('set-countdown');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const newLinkInput = document.getElementById('new-link');
        const addLinkBtn = document.getElementById('add-link');
        const linkList = document.getElementById('link-list');

        // Data lokal (akan di-sync dari JSONBin)
        let eventData = { name: 'Lomba WAR LINK', countdownTime: 0, isStarted: false, isStopped: false };
        let links = [];
        let interval;

        // Fungsi untuk fetch data dari JSONBin (polling setiap 1 detik)
        async function fetchData() {
            try {
                const response = await fetch(BIN_URL, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await response.json();
                eventData = data.record || eventData;
                links = eventData.links || [];
                updateUI();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // Fungsi untuk update data ke JSONBin
        async function updateData(newData) {
            try {
                const response = await fetch(UPDATE_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ ...eventData, ...newData })
                });
                if (response.ok) {
                    fetchData();  // Refresh data setelah update
                } else {
                    alert('Gagal update data!');
                }
            } catch (error) {
                console.error('Error updating data:', error);
            }
        }

        // Mulai polling
        setInterval(fetchData, 1000);  // Fetch setiap 1 detik
        fetchData();  // Fetch awal

        // Update UI
        function updateUI() {
            eventTitle.textContent = eventData.name;
            eventNameInput.value = eventData.name;
            renderLinks();
            if (eventData.isStopped) {
                statusEl.textContent = 'Link sudah full! Sesi dihentikan.';
                warLinkBtn.disabled = true;
                countdownEl.textContent = '00:00:00';
                clearInterval(interval);
            } else if (eventData.isStarted) {
                statusEl.textContent = 'Sesi WAR LINK sedang berlangsung!';
                warLinkBtn.disabled = false;
                countdownEl.textContent = 'MULAI!';
                clearInterval(interval);
            } else if (eventData.countdownTime > 0) {
                statusEl.textContent = 'Countdown dimulai...';
                warLinkBtn.disabled = true;
                startCountdown();
            } else {
                statusEl.textContent = 'Menunggu start dari developer...';
                warLinkBtn.disabled = true;
                countdownEl.textContent = '00:00:00';
                clearInterval(interval);
            }
        }

        // Countdown Timer
        function startCountdown() {
            clearInterval(interval);
            interval = setInterval(() => {
                if (eventData.countdownTime <= 0) {
                    clearInterval(interval);
                    updateData({ isStarted: true, countdownTime: 0 });
                    return;
                }
                eventData.countdownTime--;
                updateData({ countdownTime: eventData.countdownTime });
                const minutes = Math.floor(eventData.countdownTime / 60);
                const seconds = eventData.countdownTime % 60;
                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}:00`;
            }, 1000);
        }

        // Render Links
        function renderLinks() {
            linkList.innerHTML = '';
            links.forEach((link, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${link}</span><button onclick="removeLink(${index})">Hapus</button>`;
                linkList.appendChild(li);
            });
        }

        // Admin Access
        adminBtn.addEventListener('click', () => {
            const password = prompt('Masukkan password admin:');
            if (password === 'admin123') {
                adminPanel.style.display = 'block';
            } else {
                alert('Password salah!');
            }
        });

        // Set Event Name
        eventNameInput.addEventListener('change', () => {
            updateData({ name: eventNameInput.value });
        });

        // Set Countdown
        setCountdownBtn.addEventListener('click', () => {
            const duration = parseInt(countdownDurationInput.value);
            if (duration > 0) {
                updateData({ countdownTime: duration * 60, isStarted: false, isStopped: false });
            }
        });

        // Start
        startBtn.addEventListener('click', () => {
            if (eventData.countdownTime > 0) {
                startCountdown();
            } else {
                updateData({ isStarted: true });
            }
        });

        // Stop
        stopBtn.addEventListener('click', () => {
            updateData({ isStopped: true });
        });

        // Add Link
        addLinkBtn.addEventListener('click', () => {
            const link = newLinkInput.value.trim();
            if (link) {
                links.push(link);
                updateData({ links });
                newLinkInput.value = '';
            }
        });

        // Remove Link
        function removeLink(index) {
            links.splice(index, 1);
            updateData({ links });
        }

        // WAR LINK Button
        warLinkBtn.addEventListener('click', () => {
            if (links.length > 0 && !eventData.isStopped) {
                const randomIndex = Math.floor(Math.random() * links.length);
                const wonLink = links.splice(randomIndex, 1)[0];
                updateData({ links });
                alert(`Selamat! Anda mendapatkan link: ${wonLink}`);
                if (links.length === 0) {
                    updateData({ isStopped: true });
                }
            } else {
                alert('Tidak ada link tersedia atau sesi sudah berhenti.');
            }
        });
    </script>
</body>
</html>
